# ایک بار چلائیں: Actions ٹیب → "Setup Capacitor (run once)" → Run workflow
# یہ Capacitor کے پیکیج package.json اور package-lock.json میں جوڑ کر واپس commit کر دیتا ہے،
# تاکہ آپ کو اپنے فون/کمپیوٹر پر npm نہ چلانا پڑے۔
name: Setup Capacitor (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor packages
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/core@^7 @capacitor/app@^7 @capacitor/push-notifications@^7 @capacitor-firebase/authentication@^7
          npm install --save-dev --no-audit --no-fund @capacitor/cli@^7 @capacitor/android@^7

      - name: Commit package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Add Capacitor packages for the Android app"
          git push
