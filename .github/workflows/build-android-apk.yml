# Actions ٹیب → "Build Android APK" → Run workflow
# ختم ہونے پر اسی رن کے صفحے پر نیچے Artifacts میں "StepTuDeen-debug-apk" ملے گی۔
#
# ضروری:
#   1) Secret  GOOGLE_SERVICES_JSON  = google-services.json فائل کا مکمل متن
#      (Settings → Secrets and variables → Actions → New repository secret)
#   2) public/sounds/ میں azan.mp3, voice.mp3, tone.mp3
#   3) پہلے "Setup Capacitor (run once)" چل چکا ہو
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check required files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=0
          if [ ! -d Android-res ]; then echo "::error::android-res فولڈر موجود نہیں (آئیکن)"; missing=1; fi
          for f in azan voice tone; do
            if [ ! -f "public/sounds/$f.mp3" ]; then echo "::error::public/sounds/$f.mp3 موجود نہیں"; missing=1; fi
          done
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON نہیں ملا"; missing=1; fi
          if ! grep -q '"@capacitor/android"' package.json; then echo "::error::پہلے 'Setup Capacitor (run once)' چلائیں"; missing=1; fi
          exit $missing

      - run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add sounds, Firebase config and permission
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app/src/main/res/raw
          cp public/sounds/azan.mp3 public/sounds/voice.mp3 public/sounds/tone.mp3 android/app/src/main/res/raw/
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # Android 13+ پر نوٹیفکیشن کی اجازت کے لیے
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          fi

      - name: Add location permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for p in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            if ! grep -q "android.permission.$p" "$MANIFEST"; then
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" "$MANIFEST"
            fi
          done
          if ! grep -q "android.hardware.location.gps" "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$MANIFEST"
          fi

      - name: Install app icons
        run: |
          RES=android/app/src/main/res
          # ٹیمپلیٹ کے پرانے webp آئیکن ہٹائیں تاکہ ہمارے png سے "duplicate resources" نہ بنے
          find "$RES" -name 'ic_launcher*.webp' -delete
          cp -r Android-res/. "$RES/"
          # نوٹیفکیشن کا چھوٹا آئیکن اور رنگ (FCM کا ڈیفالٹ)
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "default_notification_icon" "$MANIFEST"; then
            sed -i 's#</application>#        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_steptudeen" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/steptudeen_notif_color" />\n    </application>#' "$MANIFEST"
          fi

      - name: Transparent status bar (edge-to-edge)
        run: |
          # سٹیٹس بار (وقت/بیٹری/سگنل) نظر آئے مگر شفاف ہو، اور ایپ کا مواد سکرین کے بالکل اوپر سے شروع ہو۔
          # ویب پیج کو سٹیٹس بار کی اونچائی JS انٹرفیس (StepNative) سے ملتی ہے، اور آئیکن کا رنگ (سفید/کالا) بھی۔
          DIR=android/app/src/main/java/com/steptudeen/app
          if [ ! -f "$DIR/MainActivity.java" ]; then echo "::error::MainActivity.java نہیں ملی ($DIR)"; exit 1; fi
          cat > "$DIR/MainActivity.java" <<'JAVA'
          package com.steptudeen.app;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;

          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  final Window window = getWindow();
                  // نوچ/کٹ آؤٹ والے فونز پر بھی اوپر تک
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = window.getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      window.setAttributes(lp);
                  }
                  // مواد سٹیٹس بار کے نیچے سے شروع ہو (پرانے اور نئے دونوں Android پر)
                  View decor = window.getDecorView();
                  decor.setSystemUiVisibility(decor.getSystemUiVisibility()
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  // ہوم پر نیلا ہیڈر ہے، اس لیے شروع میں سفید آئیکن
                  setLightIcons(true);
                  try {
                      getBridge().getWebView().addJavascriptInterface(new StepNative(), "StepNative");
                  } catch (Throwable t) {
                      // انٹرفیس نہ بنے تو ایپ پھر بھی چلے (JS میں env() fallback ہے)
                  }
              }

              private void setLightIcons(final boolean whiteIcons) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          WindowInsetsControllerCompat c =
                              WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                          // appearance light status bars = کالے آئیکن
                          c.setAppearanceLightStatusBars(!whiteIcons);
                      }
                  });
              }

              public class StepNative {
                  @JavascriptInterface
                  public float getStatusBarHeightCss() {
                      int id = getResources().getIdentifier("status_bar_height", "dimen", "android");
                      int px = id > 0 ? getResources().getDimensionPixelSize(id) : 0;
                      float density = getResources().getDisplayMetrics().density;
                      return density > 0 ? px / density : 0f;
                  }

                  @JavascriptInterface
                  public void setLightIcons(boolean whiteIcons) {
                      MainActivity.this.setLightIcons(whiteIcons);
                  }
              }
          }
          JAVA

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: StepTuDeen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
